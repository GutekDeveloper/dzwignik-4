<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dźwignik 4 - Mobile Simulator</title>
    <link rel="icon" type="image/png" href="imagines/ikonka_windy.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1f2937; /* Ciemne tło hali */
            color: white;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 100dvh;
        }

        .game-board {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            background: linear-gradient(to bottom, #374151 0%, #111827 100%);
            overflow: hidden;
        }

        /* Główny kontener windy */
        .lift-system {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 10;
        }

        /* Mechanizm nożycowy (będzie zmieniał wysokość) */
        .scissor-mechanism {
            width: 120px;
            height: 20px; /* Wysokość startowa (złożona) */
            transition: height 1.5s ease-in-out;
            position: relative;
            background-color: transparent;
        }

        .scissor-mechanism svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Klatka windy na samej górze mechanizmu */
        .lift-cage {
            width: 150px;
            height: 130px;
            border: 6px solid #2563eb; /* Niebieska rama */
            border-bottom: 8px solid #1d4ed8;
            border-radius: 4px;
            background-color: rgba(37, 99, 235, 0.1);
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            /* Siatka ochronna z tyłu */
            background-image: 
                linear-gradient(rgba(255,255,255,0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 10px 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: -2px; /* Żeby stykało się z nożycami */
        }

        .lift-sign {
            position: absolute;
            top: 5px;
            background: white;
            color: black;
            font-size: 8px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 2px;
        }

        /* Towar - Korleta */
        .cargo {
            width: 70px;
            height: 50px;
            background-color: #9ca3af; /* Stalowy kolor */
            border: 2px solid #4b5563;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 2px;
            visibility: hidden; /* Ukryte na start */
        }
        
        .cargo::before {
            content: 'KORLETA';
            font-size: 9px;
            font-weight: 900;
            color: #1f2937;
            letter-spacing: 1px;
        }

        /* Wózek widłowy z kontenerem do animacji */
        .forklift-container {
            position: absolute;
            bottom: 12%;
            left: -120px; /* Poza ekranem lub na skraju */
            width: 160px;
            height: 100px;
            z-index: 15;
            transition: transform 0.6s ease-in-out;
        }

        .forklift-drive-in {
            transform: translateX(130px); /* Podjeżdża pod windę */
        }

        .forklift-cargo {
            position: absolute;
            right: 0px;
            bottom: 8px;
            visibility: visible;
            z-index: 16;
        }

        /* Poziom górny */
        .top-level {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            height: 100%;
            border-top: 8px solid #4b5563;
            background-color: rgba(31, 41, 55, 0.8);
            z-index: 5;
        }

        .barrier {
            position: absolute;
            top: calc(25% - 40px);
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 40px;
            border: 4px solid #111827;
            border-bottom: none;
            background: repeating-linear-gradient(45deg, #fbbf24, #fbbf24 10px, #000 10px, #000 20px);
            z-index: 20;
        }

        .character-top {
            position: absolute;
            top: calc(25% - 60px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            z-index: 8;
            transition: transform 0.2s;
        }

        /* Przyciski */
        .controls {
            flex: 0 0 auto;
            width: 100%;
            background-color: #111827;
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 4px solid #000;
        }
        
        .btn {
            width: 100%;
            min-width: 0;
            min-height: 54px;
            padding: 15px 10px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 8px;
            color: white;
            transition: all 0.1s;
        }

        @media (max-width: 600px) {
            .controls {
                padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
                gap: 8px;
            }

            .btn {
                min-height: 48px;
                padding: 10px 6px;
                font-size: 0.88rem;
                line-height: 1.1;
            }

            .lift-cage {
                width: 140px;
                height: 120px;
            }

            .scissor-mechanism {
                width: 115px;
            }
        }
        .btn:active:not(:disabled) { transform: scale(0.95); }
        .btn:disabled { opacity: 0.3; filter: grayscale(100%); }

        .btn-load { background: linear-gradient(#dc2626, #991b1b); border: 2px solid #7f1d1d; }
        .btn-up { background: linear-gradient(#2563eb, #1e40af); border: 2px solid #1e3a8a; }
        .btn-recv { background: linear-gradient(#10b981, #047857); border: 2px solid #064e3b; }
        .btn-down { background: linear-gradient(#f59e0b, #b45309); border: 2px solid #78350f; }

        /* Nakładki */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Status -->
    <div class="h-16 bg-gray-900 flex justify-between items-center px-4 shadow-xl z-50 relative border-b border-gray-700">
        <div class="text-white font-bold text-sm">OPERATOR: <span class="text-blue-400">Sandra</span></div>
        <div class="text-2xl font-black text-yellow-400">PKT: <span id="scoreVal">0</span></div>
        <div class="text-xl font-black text-red-500"><span id="timeVal">60</span>s</div>
    </div>

    <!-- Plansza Gry -->
    <div class="game-board" id="gameBoard">
        <!-- Górne piętro -->
        <div class="top-level"></div>
        <div class="barrier"></div>
        <div class="character-top" id="charTop">👩‍🔧</div>

        <!-- Dźwignik Przemysłowy (System Windy) -->
        <div class="lift-system" id="liftSystem">
            <div class="lift-cage" id="liftCage">
                <div class="lift-sign">DŹWIGNIK PRZEMYSŁOWY 4</div>
                <!-- Towar na windzie -->
                <div class="cargo" id="cargoLift"></div>
            </div>
            
            <!-- Mechanizm nożycowy (SVG renderujące krzyżaki, rozciągające się dynamicznie) -->
            <div class="scissor-mechanism" id="scissorMech">
                <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                    <!-- Podwójne ramiona nożycowe -->
                    <line x1="10" y1="100" x2="90" y2="50" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
                    <line x1="90" y1="100" x2="10" y2="50" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
                    
                    <line x1="10" y1="50" x2="90" y2="0" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
                    <line x1="90" y1="50" x2="10" y2="0" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
                    
                    <!-- Sworznie łączące -->
                    <circle cx="50" cy="75" r="4" fill="#111827"/>
                    <circle cx="50" cy="25" r="4" fill="#111827"/>
                    <circle cx="10" cy="50" r="4" fill="#111827"/>
                    <circle cx="90" cy="50" r="4" fill="#111827"/>
                </svg>
            </div>
        </div>

        <!-- Wózek Widłowy -->
        <div class="forklift-container" id="forklift">
            <!-- Towar na widłach -->
            <div class="cargo forklift-cargo" id="cargoForklift"></div>
            
            <!-- Rysunek wózka SVG -->
            <svg width="100%" height="100%" viewBox="0 0 160 100" style="position: absolute; bottom: 0; left: 0;">
                <!-- Widły -->
                <rect x="110" y="80" width="50" height="6" fill="#6b7280" rx="2"/>
                <rect x="110" y="40" width="8" height="46" fill="#4b5563"/>
                
                <!-- Karoseria główna - Czerwona -->
                <path d="M 20 50 L 100 50 L 115 85 L 10 85 Z" fill="#dc2626"/>
                <path d="M 10 40 L 40 40 L 40 50 L 20 50 Z" fill="#b91c1c"/> <!-- Przeciwwaga -->
                
                <!-- Klatka kabiny -->
                <path d="M 40 50 L 45 10 L 90 10 L 95 50" fill="none" stroke="#111827" stroke-width="6" stroke-linejoin="round"/>
                <line x1="45" y1="10" x2="90" y2="10" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Operator (Gutek) zarys -->
                <circle cx="70" cy="35" r="8" fill="#fcd34d"/>
                <rect x="63" y="43" width="14" height="15" fill="#3b82f6"/>
                <line x1="75" y1="45" x2="85" y2="50" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/> <!-- Ręka na kierownicy -->
                <circle cx="90" cy="48" r="5" fill="#111827"/> <!-- Kierownica -->

                <!-- Zderzaki / detale -->
                <rect x="100" y="55" width="15" height="30" fill="#991b1b"/>
                
                <!-- Napis C88H na karoserii -->
                <text x="35" y="75" fill="white" font-family="sans-serif" font-weight="900" font-size="14">C88H</text>

                <!-- Koła (czarne opony, szare felgi) -->
                <circle cx="40" cy="85" r="14" fill="#000"/>
                <circle cx="40" cy="85" r="6" fill="#9ca3af"/>
                
                <circle cx="95" cy="85" r="12" fill="#000"/>
                <circle cx="95" cy="85" r="5" fill="#9ca3af"/>
            </svg>
        </div>
    </div>

    <!-- Przyciski sterowania -->
    <div class="controls">
        <button id="btnLoad" class="btn btn-load" onclick="game.loadCargo()">ZAŁADUJ (WÓZEK)</button>
        <button id="btnUp" class="btn btn-up" onclick="game.moveLiftUp()">WINDA GÓRA</button>
        <button id="btnReceive" class="btn btn-recv" onclick="game.receiveCargo()">ODBIERZ</button>
        <button id="btnDown" class="btn btn-down" onclick="game.moveLiftDown()">WINDA DÓŁ</button>
    </div>

    <!-- Ekrany Menu -->
    <div id="startScreen" class="overlay">
        <h1 class="text-4xl font-black text-blue-500 mb-2">DŹWIGNIK 4</h1>
        <h2 class="text-xl text-red-500 font-bold mb-6">SYMULATOR ZMIANY</h2>
        <p class="text-gray-300 text-center px-6 mb-8">
            Bartek, ty ładujesz korlety czerwonym C88H na dole. Winda w górę, a Sandra odbiera. Pokażcie jak się pracuje na magazynie! Masz 60s.
        </p>
        <button onclick="game.start()" class="bg-blue-600 px-10 py-4 rounded-xl text-2xl font-bold border-b-4 border-blue-800 shadow-lg active:border-b-0 active:translate-y-1">ROZPOCZNIJ PRACĘ</button>
    </div>

    <div id="endScreen" class="overlay hidden">
        <h1 class="text-5xl font-black text-red-500 mb-4">KONIEC ZMIANY!</h1>
        <p class="text-2xl text-white mb-6">Rozładowane korlety: <span id="finalScore" class="text-yellow-400 font-bold text-4xl">0</span></p>
        <button onclick="game.start()" class="bg-green-600 px-10 py-4 rounded-xl text-2xl font-bold border-b-4 border-green-800 shadow-lg active:border-b-0 active:translate-y-1">NOWA ZMIANA</button>
    </div>

    <script>
        const game = {
            score: 0,
            timeLeft: 60,
            timer: null,
            isActive: false,
            
            // Stany:
            liftPosition: 'bottom', // 'bottom', 'moving', 'top'
            hasCargoLift: false,
            hasCargoForklift: true,
            forkliftState: 'idle', // 'idle', 'moving'

            // Wysokości mechanizmu nożycowego.
            // Górna wysokość jest wyliczana z realnej wysokości planszy,
            // dzięki czemu winda dojeżdża do poziomu Sandry także na telefonie.
            LIFT_HEIGHT_BOTTOM: '20px',
            LIFT_HEIGHT_TOP: '240px',

            updateLiftHeight() {
                const board = document.getElementById('gameBoard');
                const scissor = document.getElementById('scissorMech');

                if (!board || !scissor) return;

                const boardHeight = board.clientHeight;

                // Dźwignik stoi 12% od dołu, a górny poziom znajduje się na 25% planszy.
                // Mechanizm musi więc pokonać około 63% wysokości planszy.
                const responsiveHeight = Math.round(boardHeight * 0.63);

                this.LIFT_HEIGHT_TOP = `${Math.max(150, responsiveHeight)}px`;

                if (this.liftPosition === 'top') {
                    scissor.style.height = this.LIFT_HEIGHT_TOP;
                } else if (this.liftPosition === 'bottom') {
                    scissor.style.height = this.LIFT_HEIGHT_BOTTOM;
                }
            },

            init() {
                this.updateLiftHeight();
                this.updateUI();

                window.addEventListener('resize', () => {
                    this.updateLiftHeight();
                });

                window.addEventListener('orientationchange', () => {
                    setTimeout(() => this.updateLiftHeight(), 100);
                });
            },

            start() {
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('endScreen').classList.add('hidden');
                
                this.score = 0;
                this.timeLeft = 60;
                this.liftPosition = 'bottom';
                this.hasCargoLift = false;
                this.hasCargoForklift = true;
                
                // Reset wizualny
                this.updateLiftHeight();
                document.getElementById('scissorMech').style.height = this.LIFT_HEIGHT_BOTTOM;
                document.getElementById('cargoLift').style.visibility = 'hidden';
                document.getElementById('cargoForklift').style.visibility = 'visible';
                document.getElementById('scoreVal').innerText = '0';
                
                this.isActive = true;
                this.updateUI();
                
                clearInterval(this.timer);
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    document.getElementById('timeVal').innerText = this.timeLeft;
                    if (this.timeLeft <= 0) this.end();
                }, 1000);
            },

            end() {
                this.isActive = false;
                clearInterval(this.timer);
                document.getElementById('finalScore').innerText = this.score;
                document.getElementById('endScreen').classList.remove('hidden');
                this.updateUI();
            },

            updateUI() {
                const btnLoad = document.getElementById('btnLoad');
                const btnUp = document.getElementById('btnUp');
                const btnRecv = document.getElementById('btnReceive');
                const btnDown = document.getElementById('btnDown');

                // Domyślne blokowanie
                btnLoad.disabled = true;
                btnUp.disabled = true;
                btnRecv.disabled = true;
                btnDown.disabled = true;

                if (!this.isActive) return;

                // Logika aktywacji przycisków
                if (this.liftPosition === 'bottom' && this.forkliftState === 'idle') {
                    if (!this.hasCargoLift && this.hasCargoForklift) btnLoad.disabled = false;
                    btnUp.disabled = false;
                }
                
                if (this.liftPosition === 'top') {
                    if (this.hasCargoLift) btnRecv.disabled = false;
                    if (!this.hasCargoLift) btnDown.disabled = false;
                }
            },

            // Akcja: Podjazd wózkiem i ładunek
            loadCargo() {
                if (this.liftPosition !== 'bottom' || this.hasCargoLift) return;
                
                this.forkliftState = 'moving';
                this.updateUI();
                
                const fl = document.getElementById('forklift');
                const cLift = document.getElementById('cargoLift');
                const cFork = document.getElementById('cargoForklift');

                // 1. Wózek podjeżdża
                fl.classList.add('forklift-drive-in');
                
                setTimeout(() => {
                    // 2. Przekazanie towaru na windę
                    cFork.style.visibility = 'hidden';
                    cLift.style.visibility = 'visible';
                    this.hasCargoLift = true;
                    this.hasCargoForklift = false;
                    
                    // 3. Wózek odjeżdża po chwili
                    setTimeout(() => {
                        fl.classList.remove('forklift-drive-in');
                        
                        setTimeout(() => {
                            // 4. Wózek odzyskał nowy towar poza ekranem, jest gotowy
                            this.hasCargoForklift = true;
                            cFork.style.visibility = 'visible';
                            this.forkliftState = 'idle';
                            this.updateUI();
                        }, 600);
                        
                    }, 400);
                }, 600);
            },

            moveLiftUp() {
                if (this.liftPosition !== 'bottom') return;
                
                this.liftPosition = 'moving';
                this.updateUI();
                
                // Animacja nożyc - rozciąganie do góry
                this.updateLiftHeight();
                document.getElementById('scissorMech').style.height = this.LIFT_HEIGHT_TOP;
                
                setTimeout(() => {
                    this.liftPosition = 'top';
                    this.updateUI();
                }, 1500);
            },

            receiveCargo() {
                if (this.liftPosition !== 'top' || !this.hasCargoLift) return;
                
                // Odbiór towaru
                this.hasCargoLift = false;
                document.getElementById('cargoLift').style.visibility = 'hidden';
                
                this.score++;
                document.getElementById('scoreVal').innerText = this.score;
                
                // Radość postaci
                const char = document.getElementById('charTop');
                char.innerText = '🙋‍♀️';
                char.style.transform = 'translateX(-50%) translateY(-10px) scale(1.2)';
                
                setTimeout(() => {
                    char.innerText = '👩‍🔧';
                    char.style.transform = 'translateX(-50%)';
                    this.updateUI();
                }, 800);
                
                this.updateUI();
            },

            moveLiftDown() {
                if (this.liftPosition !== 'top') return;
                
                this.liftPosition = 'moving';
                this.updateUI();
                
                // Animacja nożyc - składanie do dołu
                document.getElementById('scissorMech').style.height = this.LIFT_HEIGHT_BOTTOM;
                
                setTimeout(() => {
                    this.liftPosition = 'bottom';
                    this.updateUI();
                }, 1500);
            }
        };

        // Inicjalizacja przycisków przy wczytaniu
        game.init();
    </script>
</body>
</html>
